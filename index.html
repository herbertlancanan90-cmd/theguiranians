<style>
:root{--navy:#102d91;--blue:#174bd6;--cyan:#19bce8;--yellow:#ffd21c;--red:#f04438;--green:#17a85b;--ink:#17213d;--muted:#69738d;--paper:#f5f8ff;--white:#fff;--line:#e5eaf5;--shadow:0 16px 42px rgba(20,45,115,.10)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Poppins,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:1200px;margin:auto;padding:0 24px}.topline{height:6px;background:linear-gradient(90deg,var(--yellow) 0 25%,var(--red) 25% 50%,var(--green) 50% 75%,var(--cyan) 75%)}header{background:#fff;position:sticky;top:0;z-index:10;box-shadow:0 5px 24px #11265b0d}.nav{min-height:82px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand img{width:56px;height:56px;object-fit:contain}.brand strong{display:block;color:var(--navy);font-size:17px;letter-spacing:.3px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1.2px;font-weight:600}.navlinks{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.navlinks button{border:0;background:transparent;color:#4e5872;padding:11px 14px;border-radius:13px;font-size:13px;font-weight:600}.navlinks button.active,.navlinks button:hover{background:#edf2ff;color:var(--navy)}.admin-btn,.primary{border:0;border-radius:13px;background:var(--navy);color:#fff;padding:12px 17px;font-weight:600;box-shadow:0 7px 18px #102d9120}.admin-btn:hover,.primary:hover{background:#2149c3}.mobile-menu{display:none}.hero{margin:28px auto 36px;display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;background:linear-gradient(130deg,#102d91 0%,#174bd6 60%,#12b9e8 120%);border-radius:30px;overflow:hidden;color:white;min-height:390px;position:relative}.hero-copy{padding:46px 0 46px 48px;position:relative;z-index:1}.eyebrow{display:inline-flex;align-items:center;gap:8px;background:#ffffff20;border:1px solid #ffffff45;padding:8px 13px;border-radius:99px;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700}.dot{width:7px;height:7px;background:var(--yellow);border-radius:50%}.hero h1{font-size:clamp(36px,5vw,60px);line-height:1.08;letter-spacing:-2px;margin:19px 0 14px}.hero h1 span{color:var(--yellow)}.hero p{max-width:500px;color:#e4edff;font-size:14px;line-height:1.9}.hero-actions{display:flex;gap:12px;margin-top:25px;flex-wrap:wrap}.hero .primary{background:var(--yellow);color:var(--navy);box-shadow:none}.secondary{border:1px solid #ffffff70;background:#ffffff12;color:white;padding:12px 17px;border-radius:13px;font-weight:600}.hero-art{height:100%;display:flex;align-items:center;justify-content:center;position:relative;padding:25px}.hero-art:before,.hero-art:after{content:"";position:absolute;border-radius:50%;border:1px solid #ffffff24;width:330px;height:330px}.hero-art:after{width:260px;height:260px}.hero-art img{width:min(100%,365px);max-height:350px;object-fit:contain;filter:drop-shadow(0 18px 24px #00175a50);z-index:1}.sun{position:absolute;right:15%;top:12%;width:75px;height:75px;background:var(--yellow);opacity:.9;border-radius:50%;filter:blur(1px)}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:38px 0 18px}.section-head h2{font-size:24px;margin:0;letter-spacing:-.7px}.section-head p{margin:5px 0 0;color:var(--muted);font-size:12px}.text-btn{border:0;background:none;color:var(--blue);font-size:12px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:35px}.stat{background:white;border:1px solid var(--line);border-radius:20px;padding:19px 22px;display:flex;align-items:center;gap:14px}.stat-icon{width:43px;height:43px;border-radius:14px;display:grid;place-items:center;font-size:20px;background:#edf2ff}.stat strong{font-size:20px;display:block;color:var(--navy)}.stat span{font-size:11px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.story-card,.cartoon-card{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 8px 24px #11265b06;transition:transform .2s,box-shadow .2s}.story-card:hover,.cartoon-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.story-img{height:190px;background:linear-gradient(135deg,#dceaff,#bdeefa);display:grid;place-items:center;overflow:hidden}.story-img img,.cartoon-img img{width:100%;height:100%;object-fit:cover}.placeholder-art{font-size:48px}.card-body{padding:20px}.category{display:inline-block;font-size:10px;letter-spacing:.8px;text-transform:uppercase;font-weight:700;color:var(--blue);background:#edf2ff;padding:6px 9px;border-radius:8px}.card-body h3{font-size:16px;line-height:1.45;margin:12px 0 8px}.card-body p{font-size:12px;line-height:1.8;color:var(--muted);margin:0}.byline{display:flex;justify-content:space-between;gap:10px;margin-top:18px;padding-top:13px;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}.cartoon-card{display:grid;grid-template-columns:.9fr 1.1fr;min-height:210px}.cartoon-img{min-height:210px;background:linear-gradient(135deg,#fff2bd,#ffd2d2);display:grid;place-items:center;overflow:hidden}.cartoon-body{padding:22px}.cartoon-body h3{margin:12px 0 8px;font-size:17px}.cartoon-body p{font-size:12px;line-height:1.8;color:var(--muted)}.quote-strip{margin:40px 0;background:#fff;border:1px solid var(--line);border-radius:22px;padding:25px 30px;display:flex;align-items:center;gap:18px}.quote-mark{font-size:42px;color:var(--yellow);font-weight:800;line-height:1}.quote-strip p{margin:0;font-size:14px;font-weight:600}.quote-strip small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.page-title{padding:35px 0 20px}.page-title h1{font-size:34px;margin:0 0 7px;letter-spacing:-1px}.page-title p{margin:0;color:var(--muted);font-size:13px}.toolbar{display:flex;gap:10px;margin:12px 0 22px;flex-wrap:wrap}.search{flex:1;min-width:200px;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 15px;outline:none}.search:focus,input:focus,textarea:focus{border-color:#91a9ff;box-shadow:0 0 0 3px #174bd615;outline:none}.filter{border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px;color:var(--ink)}.empty{padding:45px 20px;text-align:center;background:white;border:1px dashed #cbd5ed;border-radius:20px;color:var(--muted)}footer{margin-top:55px;background:#0c216d;color:white;padding:30px 0}.footer-inner{display:flex;align-items:center;justify-content:space-between;gap:20px}.footer-brand{display:flex;align-items:center;gap:12px}.footer-brand img{width:45px;height:45px;object-fit:contain}.footer-brand strong{display:block;font-size:13px}.footer-brand small,.footer-note{font-size:10px;color:#c5d4ff}.footer-note{text-align:right;line-height:1.8}.modal-backdrop{position:fixed;inset:0;background:#07143dcc;z-index:50;display:none;align-items:center;justify-content:center;padding:18px;overflow:auto}.modal-backdrop.open{display:flex}.modal{width:min(720px,100%);max-height:92vh;overflow:auto;background:white;border-radius:24px;padding:25px;box-shadow:0 24px 80px #0004}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}.modal-head h2{margin:0;font-size:22px}.close{border:0;background:#eef2fb;border-radius:10px;width:38px;height:38px;font-size:21px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs button{border:0;background:#f1f4fb;border-radius:10px;padding:10px 14px;font-size:12px;font-weight:600}.tabs button.active{background:var(--navy);color:white}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}.field label{font-size:11px;font-weight:700;color:#47516b}.field input,.field textarea,.field select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink);font-size:13px}.field textarea{min-height:100px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.danger{border:1px solid #ffd6d3;background:#fff4f3;color:#c7352b;border-radius:12px;padding:11px 14px;font-weight:600}.admin-list{display:grid;gap:10px}.admin-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px}.admin-row strong{font-size:12px;display:block}.admin-row small{font-size:10px;color:var(--muted)}.row-actions{display:flex;gap:6px}.row-actions button{border:1px solid var(--line);background:white;border-radius:9px;padding:7px 9px;font-size:11px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#102d91;color:white;padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:80;font-size:12px;display:none}.toast.show{display:block}.detail{background:white;border:1px solid var(--line);border-radius:24px;padding:28px;margin:20px 0}.detail h1{font-size:30px;line-height:1.25}.detail .cover{height:300px;background:#e8efff;border-radius:18px;overflow:hidden;display:grid;place-items:center}.detail .cover img{width:100%;height:100%;object-fit:cover}.detail .article-text{font-size:14px;line-height:2;color:#3e4965;white-space:pre-wrap}.detail .caption{font-size:11px;color:var(--muted);font-style:italic;margin-top:8px}
@media(max-width:850px){.hero{grid-template-columns:1fr}.hero-copy{padding:35px 32px 0}.hero-art{height:260px}.hero-art img{max-height:240px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.cartoon-card{grid-template-columns:1fr}.cartoon-img{min-height:180px}.nav{flex-wrap:wrap;padding:12px 0}.navlinks{order:3;width:100%;justify-content:center}.navlinks button{padding:9px 10px}.admin-btn{padding:10px 12px}}
@media(max-width:560px){.shell{padding:0 15px}.brand img{width:46px;height:46px}.brand strong{font-size:14px}.brand small{font-size:8px}.navlinks{gap:2px}.navlinks button{font-size:11px;padding:9px 8px}.hero{margin-top:18px;border-radius:23px}.hero-copy{padding:28px 22px 0}.hero h1{font-size:39px;letter-spacing:-1.4px}.hero p{font-size:12px}.hero-art{height:230px}.stats{grid-template-columns:1fr}.stat{padding:14px 17px}.cards{grid-template-columns:1fr}.story-img{height:205px}.section-head h2{font-size:21px}.section-head{align-items:start}.page-title h1{font-size:28px}.form-grid{grid-template-columns:1fr}.footer-inner{align-items:flex-start;flex-direction:column}.footer-note{text-align:left}.detail{padding:18px}.detail h1{font-size:24px}.detail .cover{height:220px}.quote-strip{padding:20px}.modal{padding:19px}}
</style>
</head>
<body>
<div class="topline"></div>
<header><div class="shell nav">
  <div class="brand"><img src="assets/guiranians-logo.png" alt="The Guiranians publication logo"><div><strong>THE GUIRANIANS</strong><small>GUIRANG ELEMENTARY SCHOOL</small></div></div>
  <nav class="navlinks" aria-label="Main navigation">
    <button class="active" data-page="home">Home</button><button data-page="stories">Feature Stories</button><button data-page="cartoons">Editorial Cartooning</button>
  </nav>
  <button class="admin-btn" id="openAdmin">⚙ Admin CMS</button>
</div></header>
<main class="shell" id="app"></main>
<footer><div class="shell footer-inner"><div class="footer-brand"><img src="assets/guiranians-logo.png" alt=""><div><strong>THE GUIRANIANS</strong><small>The student publication of Guirang Elementary School</small></div></div><div class="footer-note">Informing • Inspiring • Empowering<br>Made for the Guirang school community</div></div></footer>
<div class="modal-backdrop" id="adminModal" role="dialog" aria-modal="true" aria-labelledby="adminTitle">
 <div class="modal"><div class="modal-head"><div><h2 id="adminTitle">Publication CMS</h2><div style="font-size:11px;color:var(--muted);margin-top:4px">Manage placeholder stories and cartoons on this device.</div></div><button class="close" id="closeAdmin" aria-label="Close">×</button></div>
 <div class="tabs"><button class="active" data-tab="stories">Feature stories</button><button data-tab="cartoons">Editorial cartoons</button><button data-tab="add">Add new</button></div>
 <div id="adminContent"></div>
 </div>
</div><div class="toast" id="toast"></div>
<script>
const defaultStories=[
{id:"s1",title:"Small Steps, Brighter Futures: Our School Garden",category:"School Life",author:"The Guiranians Editorial Team",date:"2026-10-15",image:"",caption:"Learners nurture young seedlings in the school garden.",excerpt:"A greener campus begins with small acts of care. Learners are discovering how planting and teamwork can make a lasting difference.",body:"A greener campus begins with small acts of care. At Guirang Elementary School, learners are discovering how planting, patience, and teamwork can make a lasting difference.\\n\\nThe school garden gives pupils a hands-on opportunity to observe plant growth, practice responsibility, and understand the value of caring for the environment. Teachers can connect the activity to science lessons while encouraging learners to work together toward a shared goal.\\n\\nAs the garden grows, so does a simple lesson: meaningful change often starts with one small seed. This sample feature is placeholder content and should be replaced with a verified school story before publication."},
{id:"s2",title:"Every Reader, a New Adventure",category:"Learning",author:"Mika Santos (Sample Author)",date:"2026-10-08",image:"",caption:"A quiet reading moment opens a world of imagination.",excerpt:"Reading builds confidence, curiosity, and a lifelong love of learning—one page at a time.",body:"Every book offers a doorway to a new place, idea, or point of view. In this sample story, learners make time for reading and share the stories that inspire them.\\n\\nReading regularly can strengthen vocabulary, comprehension, and imagination. Families and teachers can help by making books accessible and inviting children to talk about what they read.\\n\\nThis is placeholder content for the school publication. Please replace it with a fact-checked article and confirm all names, details, and permissions."},
{id:"s3",title:"Teamwork Takes Center Stage",category:"Campus Community",author:"Juan Dela Cruz (Sample Author)",date:"2026-09-28",image:"",caption:"Learners practice collaboration during a school activity.",excerpt:"School activities help learners practice leadership, sportsmanship, and respect for one another.",body:"A strong school community is built through shared effort. This sample feature celebrates the teamwork learners demonstrate during classroom and campus activities.\\n\\nBy listening, sharing responsibilities, and encouraging classmates, pupils learn skills that reach far beyond a single event. Teachers and school leaders can use these moments to reinforce fairness, inclusion, and positive participation.\\n\\nPlaceholder story: replace with actual reporting, interviews, and school-approved photos before publishing."}
];
const defaultCartoons=[
{id:"c1",title:"A Little Less Litter, A Lot More Care",image:"",message:"The cartoon’s message is that keeping the school clean is everyone’s responsibility. Small choices—using bins, reusing materials, and picking up after ourselves—help create a healthier learning environment.",caption:"Sample concept: choose care over litter."},
{id:"c2",title:"Make Room for Every Voice",image:"",message:"This placeholder cartoon concept encourages learners to listen respectfully and include classmates in conversations and group work. A stronger classroom is one where everyone has a chance to contribute.",caption:"Sample concept: inclusion makes a stronger community."}
];
let stories=load("guiranians_stories",defaultStories), cartoons=load("guiranians_cartoons",defaultCartoons), page="home", searchTerm="", editId=null, editType="stories", adminTab="stories";
function load(key,fallback){try{const x=localStorage.getItem(key);return x?JSON.parse(x):fallback}catch(e){return fallback}}
function save(){localStorage.setItem("guiranians_stories",JSON.stringify(stories));localStorage.setItem("guiranians_cartoons",JSON.stringify(cartoons))}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function dateFmt(d){if(!d)return "Date to be added";let x=new Date(d+"T12:00:00");return isNaN(x)?"Date to be added":x.toLocaleDateString("en-PH",{year:"numeric",month:"short",day:"numeric"})}
function art(image,emoji="📚"){return image?`<img src="${esc(image)}" alt="Publication artwork">`:`<div class="placeholder-art" aria-label="Placeholder artwork">${emoji}</div>`}
function storyCard(s){return `<article class="story-card"><div class="story-img">${art(s.image,"📖")}</div><div class="card-body"><span class="category">${esc(s.category||"Feature")}</span><h3>${esc(s.title)}</h3><p>${esc(s.excerpt||"Read this school community feature.")}</p><div class="byline"><span>✍ ${esc(s.author||"Editorial Team")}</span><span>${dateFmt(s.date)}</span></div><button class="text-btn" style="padding:13px 0 0" onclick="openStory('${esc(s.id)}')">Read full story →</button></div></article>`}
function cartoonCard(c){return `<article class="cartoon-card"><div class="cartoon-img">${art(c.image,"🎨")}</div><div class="cartoon-body"><span class="category">Editorial cartoon</span><h3>${esc(c.title)}</h3><p>${esc(c.message)}</p><p style="font-style:italic;font-size:10px">${esc(c.caption||"Illustration caption")}</p></div></article>`}
function render(){document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));let app=document.getElementById("app");
if(page==="home"){app.innerHTML=`<section class="hero"><div class="hero-copy"><span class="eyebrow"><span class="dot"></span> The voice of our school</span><h1>Stories that<br><span>bring us</span> together.</h1><p>Welcome to <b>The Guiranians</b>, the student publication of Guirang Elementary School. Celebrating learner voices, sharing campus stories, and inspiring our community.</p><div class="hero-actions"><button class="primary" onclick="go('stories')">Explore feature stories ↗</button><button class="secondary" onclick="go('cartoons')">See editorial cartoons</button></div></div><div class="hero-art"><div class="sun"></div><img src="assets/guiranians-logo.png" alt="The Guiranians logo"></div></section>
<div class="stats"><div class="stat"><div class="stat-icon">📰</div><div><strong>${stories.length.toString().padStart(2,"0")}</strong><span>Sample feature stories</span></div></div><div class="stat"><div class="stat-icon">🎨</div><div><strong>${cartoons.length.toString().padStart(2,"0")}</strong><span>Cartoon concepts</span></div></div><div class="stat"><div class="stat-icon">🌟</div><div><strong>One school</strong><span>Many voices, shared future</span></div></div></div>
<div class="section-head"><div><h2>Stories from our school</h2><p>Meet the people, ideas, and moments shaping our community.</p></div><button class="text-btn" onclick="go('stories')">View all stories →</button></div><div class="cards">${stories.slice(0,3).map(storyCard).join("")}</div>
<div class="section-head"><div><h2>Ideas in illustration</h2><p>Editorial cartoons that make us pause, think, and talk.</p></div><button class="text-btn" onclick="go('cartoons')">View cartoons →</button></div><div class="cards">${cartoons.slice(0,2).map(cartoonCard).join("")}</div>
<div class="quote-strip"><div class="quote-mark">“</div><div><p>Every learner has a story. Every story can make a difference.</p><small>THE GUIRANIANS • Informing, inspiring, empowering</small></div></div>`;
}else if(page==="stories"){app.innerHTML=`<div class="page-title"><h1>Feature Stories <span style="color:var(--yellow)">.</span></h1><p>In-depth stories, real voices, and moments that matter at Guirang Elementary School.</p></div><div class="toolbar"><input class="search" id="storySearch" placeholder="Search stories, topics, or authors..." value="${esc(searchTerm)}"><select class="filter" id="categoryFilter"><option value="">All categories</option>${[...new Set(stories.map(s=>s.category||"Feature"))].map(c=>`<option>${esc(c)}</option>`).join("")}</select></div><div class="cards" id="storyCards">${filteredStories().map(storyCard).join("")||'<div class="empty">No stories match your search yet.</div>'}</div>`;document.getElementById("storySearch").addEventListener("input",e=>{searchTerm=e.target.value;updateStoryList()});document.getElementById("categoryFilter").addEventListener("change",updateStoryList);
}else if(page==="cartoons"){app.innerHTML=`<div class="page-title"><h1>Editorial Cartooning <span style="color:var(--yellow)">.</span></h1><p>Visual commentary with a message—thoughtful, fair, and made to spark conversation.</p></div><div class="quote-strip"><div class="quote-mark">✎</div><div><p>A good editorial cartoon uses a clear visual idea to invite reflection.</p><small>Sample concepts below use placeholder artwork; upload approved cartoon images through the CMS.</small></div></div><div class="cards">${cartoons.map(cartoonCard).join("")||'<div class="empty">No cartoons have been added yet.</div>'}</div>`}
}
function filteredStories(){let term=searchTerm.toLowerCase();let cat=document.getElementById("categoryFilter")?.value||"";return stories.filter(s=>(!term||[s.title,s.category,s.author,s.excerpt].join(" ").toLowerCase().includes(term))&&(!cat||s.category===cat))}
function updateStoryList(){let el=document.getElementById("storyCards");if(el)el.innerHTML=filteredStories().map(storyCard).join("")||'<div class="empty">No stories match your search yet.</div>'}
function go(p){page=p;searchTerm="";render();window.scrollTo({top:0,behavior:"smooth"})}
function openStory(id){let s=stories.find(x=>x.id===id);if(!s)return;document.getElementById("app").innerHTML=`<button class="text-btn" onclick="go('stories')">← Back to feature stories</button><article class="detail"><span class="category">${esc(s.category||"Feature")}</span><h1>${esc(s.title)}</h1><p style="color:var(--muted);font-size:12px">By ${esc(s.author||"Editorial Team")} · ${dateFmt(s.date)}</p><div class="cover">${art(s.image,"📖")}</div><div class="caption">${esc(s.caption||"Photo caption to be added.")}</div><div class="article-text">${esc(s.body||s.excerpt||"Story content to be added.")}</div><p style="color:var(--muted);font-size:10px;margin-top:25px">Editorial note: sample content—verify details and obtain photo permissions before publication.</p></article>`;window.scrollTo({top:0,behavior:"smooth"})}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
document.getElementById("openAdmin").addEventListener("click",()=>{document.getElementById("adminModal").classList.add("open");renderAdmin()});
document.getElementById("closeAdmin").addEventListener("click",()=>document.getElementById("adminModal").classList.remove("open"));
document.getElementById("adminModal").addEventListener("click",e=>{if(e.target.id==="adminModal")e.currentTarget.classList.remove("open")});
document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{adminTab=b.dataset.tab;editId=null;document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));renderAdmin()}));
function renderAdmin(){let el=document.getElementById("adminContent");if(adminTab==="add"||editId){let type=editType, item=editId?(type==="stories"?stories:cartoons).find(x=>x.id===editId):{};el.innerHTML=`<form id="itemForm"><div class="field"><label>Content type</label><select id="fType"><option value="stories" ${type==="stories"?"selected":""}>Feature story</option><option value="cartoons" ${type==="cartoons"?"selected":""}>Editorial cartoon</option></select></div><div class="field"><label>Title *</label><input id="fTitle" required value="${esc(item.title||"")}" placeholder="Enter a clear, engaging title"></div><div class="field"><label>Image URL (optional)</label><input id="fImage" value="${esc(item.image||"")}" placeholder="https://..."></div><div id="storyFields" style="${type==="cartoons"?"display:none":""}"><div class="form-grid"><div class="field"><label>Category</label><input id="fCategory" value="${esc(item.category||"Campus Life")}"></div><div class="field"><label>Author</label><input id="fAuthor" value="${esc(item.author||"Editorial Team")}"></div><div class="field"><label>Publication date</label><input id="fDate" type="date" value="${esc(item.date||"")}"></div><div class="field"><label>Photo caption</label><input id="fCaption" value="${esc(item.caption||"")}"></div></div><div class="field"><label>Short summary</label><textarea id="fExcerpt">${esc(item.excerpt||"")}</textarea></div><div class="field"><label>Full story</label><textarea id="fBody" style="min-height:160px">${esc(item.body||"")}</textarea></div></div><div id="cartoonFields" style="${type==="stories"?"display:none":""}"><div class="field"><label>Message / explanation</label><textarea id="fMessage">${esc(item.message||"")}</textarea></div><div class="field"><label>Image caption</label><input id="fCartoonCaption" value="${esc(item.caption||"")}"></div></div><div class="modal-actions"><button type="button" class="text-btn" id="cancelEdit">Cancel</button><button class="primary" type="submit">${editId?"Save changes":"Add content"}</button></div></form>`;
document.getElementById("fType").addEventListener("change",e=>{editType=e.target.value;renderAdmin()});document.getElementById("cancelEdit").addEventListener("click",()=>{editId=null;adminTab="stories";renderAdmin()});
document.getElementById("itemForm").addEventListener("submit",e=>{e.preventDefault();let t=document.getElementById("fType").value;let data={id:editId||("x"+Date.now()),title:document.getElementById("fTitle").value.trim(),image:document.getElementById("fImage").value.trim()};if(t==="stories")Object.assign(data,{category:document.getElementById("fCategory").value,author:document.getElementById("fAuthor").value,date:document.getElementById("fDate").value,caption:document.getElementById("fCaption").value,excerpt:document.getElementById("fExcerpt").value,body:document.getElementById("fBody").value});else Object.assign(data,{message:document.getElementById("fMessage").value,caption:document.getElementById("fCartoonCaption").value});let arr=t==="stories"?stories:cartoons;let i=arr.findIndex(x=>x.id===data.id);if(i>=0)arr[i]=data;else arr.unshift(data);save();editId=null;editType=t;adminTab=t;renderAdmin();render();toast("Content saved on this device.");});return}
let arr=adminTab==="stories"?stories:cartoons;el.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><span style="font-size:12px;color:var(--muted)">${arr.length} item(s)</span><button class="primary" id="newItem">＋ Add ${adminTab==="stories"?"story":"cartoon"}</button></div><div class="admin-list">${arr.map(x=>`<div class="admin-row"><div><strong>${esc(x.title)}</strong><small>${adminTab==="stories"?esc(x.author||"Editorial Team")+" · "+dateFmt(x.date):"Editorial cartoon"}</small></div><div class="row-actions"><button data-edit="${esc(x.id)}">Edit</button><button data-delete="${esc(x.id)}">Delete</button></div></div>`).join("")||'<div class="empty">Nothing here yet. Add your first item.</div>'}</div><p style="font-size:10px;line-height:1.7;color:var(--muted);margin-top:18px">Demo CMS note: changes are stored in this browser using local storage. This prototype has no user accounts or server database. Do not enter sensitive information.</p><button class="text-btn" id="resetDemo" style="margin-top:5px">Reset all content to sample data</button>`;
document.getElementById("newItem").addEventListener("click",()=>{editId=null;editType=adminTab;adminTab="add";renderAdmin()});el.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>{editId=b.dataset.edit;editType=adminTab;renderAdmin()}));el.querySelectorAll("[data-delete]").forEach(b=>b.addEventListener("click",()=>{if(confirm("Delete this item? This cannot be undone.")){if(adminTab==="stories")stories=stories.filter(x=>x.id!==b.dataset.delete);else cartoons=cartoons.filter(x=>x.id!==b.dataset.delete);save();renderAdmin();render();toast("Item deleted.")}}));document.getElementById("resetDemo").addEventListener("click",()=>{if(confirm("Reset all stories and cartoons to the original placeholder content?")){stories=structuredClone(defaultStories);cartoons=structuredClone(defaultCartoons);save();renderAdmin();render();toast("Sample content restored.")}})}
function toast(msg){let t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}
render();
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body></html>
